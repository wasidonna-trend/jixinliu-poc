<style>
:root {
  --paper: #f5f1e8;
  --paper-warm: #ebe4d4;
  --ivory: #faf7ef;
  --ink: #2b2a26;
  --ink-soft: #4a4842;
  --line: #d4cdb8;
  --gold: #c9a96a;
  --gold-deep: #a88440;
  --gold-light: #e3cfa1;
  --cinnabar: #a44d3a;
  --bamboo: #4a6157;
  --serif-tc: 'Noto Serif TC', serif;
  --serif-en: 'Cormorant Garamond', serif;
}
body { background: #d8d2c0; font-family: var(--serif-tc); margin: 0; }
.frame { width:100%; height:100%; display:grid; place-items:center; padding:18px; box-sizing:border-box; }
.frame.dark { background:var(--ink); }
.frame.warm { background:var(--paper-warm); }
.frame.ivory { background:var(--ivory); }
.frame.cream { background:var(--paper); }

.lockup { display:flex; align-items:center; gap:20px; }
.lockup.stack { flex-direction:column; gap:14px; text-align:center; }
.wm-en { font-family:var(--serif-en); font-style:italic; font-size:26px; color:var(--ink); letter-spacing:0.18em; font-weight:500; }
.wm-en .amp { color:var(--cinnabar); margin:0 4px; }
.wm-tagline { font-family:var(--serif-en); font-style:italic; font-size:11px; color:var(--gold-deep); letter-spacing:0.32em; margin-top:4px; text-transform:uppercase; }
.wm-tc { font-family:var(--serif-tc); font-weight:400; font-size:12px; color:var(--ink-soft); letter-spacing:0.38em; margin-top:6px; padding-left:0.38em; }
.dark .wm-en { color:var(--paper); }
.dark .wm-tagline { color:var(--gold-light); }
.dark .wm-tc { color:rgba(245,241,232,0.55); }

.note { padding:22px 24px; }
.note h4 { font-family:var(--serif-tc); font-weight:500; font-size:16px; color:var(--ink); margin:0 0 8px; letter-spacing:0.06em; }
.note h4 small { font-family:var(--serif-en); font-style:italic; color:var(--gold-deep); font-size:12px; margin-left:8px; letter-spacing:0.16em; }
.note p { font-weight:400; font-size:13px; color:var(--ink-soft); line-height:1.85; margin:0 0 8px; }
.note .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
.note .tag { padding:3px 10px; background:var(--paper-warm); border:1px solid var(--line); font-family:var(--serif-en); font-style:italic; font-size:10px; color:var(--gold-deep); letter-spacing:0.16em; text-transform:uppercase; }

/* slow breathing animation for hero */
@keyframes breathe { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.025); } }
.breathe { animation: breathe 6s ease-in-out infinite; transform-origin: center; }

/* mono test */
.mono-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:18px; height:100%; box-sizing:border-box; }
.mono-cell { aspect-ratio:1; display:grid; place-items:center; padding:14px; }
.mono-cell.paper { background:var(--ivory); border:1px solid var(--line); }
.mono-cell.dark { background:var(--ink); }
.mono-cell.cinnabar { background:var(--cinnabar); }
.mono-cell.gold { background:var(--gold); }

.fav-strip { display:flex; gap:14px; align-items:center; justify-content:center; padding:18px; height:100%; box-sizing:border-box; }

/* Business card */
.bcard { width:100%; max-width:520px; aspect-ratio:91/55; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; box-shadow:0 30px 60px -25px rgba(0,0,0,0.35), 0 8px 16px -8px rgba(0,0,0,0.18); }
.bcard .bc-front { background:var(--paper); padding:28px; display:flex; flex-direction:column; justify-content:space-between; }
.bcard .bc-back { background:var(--ink); padding:28px; display:grid; place-items:center; position:relative; overflow:hidden; }
.bcard .bc-back::before { content:''; position:absolute; inset:0; background:radial-gradient(50% 70% at 70% 30%, rgba(201,169,106,0.2), transparent 60%); }
.bcard h3 { font-family:var(--serif-tc); font-weight:500; font-size:17px; color:var(--ink); letter-spacing:0.1em; margin:0 0 2px; }
.bcard .role { font-family:var(--serif-en); font-style:italic; color:var(--gold-deep); font-size:11px; letter-spacing:0.18em; }
.bcard .bc-meta { font-family:var(--serif-en); font-style:italic; color:var(--ink-soft); font-size:10px; line-height:1.7; letter-spacing:0.04em; }
.bcard .bc-meta .r { display:flex; gap:6px; }
.bcard .bc-meta .k { color:var(--gold-deep); width:48px; flex-shrink:0; letter-spacing:0.16em; text-transform:uppercase; }
</style>
</head>

   Each interprets it through a different natural metaphor.

// 01 · Pure Taiji — refined yin-yang with a soft brush feel, cinnabar dot

);

const MarkCosmicEmbrace = ({ size=100, outer='var(--gold-deep)', inner='var(--cinnabar)', dot='var(--ink)' }) => (

    <circle cx="50" cy="72" r="3" fill="var(--paper)"/>
  </svg>
);

              <p><strong>3. 動態延伸性高</strong>：圓環可做緩慢呼吸動畫（已實作於網站 Hero），與品牌的「8 秒呼吸節律」完美呼應。</p>
              <p><strong>4. 縮放穩定</strong>：從 16px favicon 到大型招牌，三層結構都不失辨識。</p>
