<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>極心流 ・ Logo 探索 8 種方向</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Noto+Sans+TC:wght@300;400;500;600&family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f5f1e8;
  --paper-warm: #ebe4d4;
  --ivory: #faf7ef;
  --ink: #2b2a26;
  --ink-soft: #4a4842;
  --ink-mute: #8a8579;
  --line: #d4cdb8;
  --line-soft: #e3ddc8;
  --gold: #c9a96a;
  --gold-deep: #a88440;
  --gold-light: #e3cfa1;
  --cinnabar: #a44d3a;
  --cinnabar-deep: #7a3526;
  --serif-tc: 'Noto Serif TC', serif;
  --serif-en: 'Cormorant Garamond', serif;
  --sans-tc: 'Noto Sans TC', sans-serif;
}
body { background: #d8d2c0; font-family: var(--sans-tc); margin: 0; }

/* Logo presentation primitives */
.logo-frame { width: 100%; height: 100%; display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
.logo-frame.dark { background: var(--ink); color: var(--paper); }
.logo-frame.warm { background: var(--paper-warm); }
.logo-frame.ivory { background: var(--ivory); }
.logo-frame.cream { background: var(--paper); }

/* === A · 朱印「心」 === */
.logo-a {
  display: flex; align-items: center; gap: 18px;
}
.logo-a .stamp {
  width: 86px; height: 86px;
  background: var(--cinnabar);
  display: grid; place-items: center;
  font-family: var(--serif-tc); font-weight: 500;
  color: var(--paper); font-size: 56px;
  letter-spacing: 0;
  position: relative;
}
.logo-a .stamp::before, .logo-a .stamp::after {
  content: ''; position: absolute;
  background: rgba(245,241,232,0.0);
}
.logo-a .stamp::before { inset: 6px; border: 1px solid rgba(245,241,232,0.25); }
.logo-a .word .tc {
  font-family: var(--serif-tc); font-weight: 500;
  font-size: 26px; color: var(--ink); letter-spacing: 0.16em;
  line-height: 1.05;
}
.logo-a .word .en {
  font-family: var(--serif-en); font-style: italic;
  font-size: 14px; color: var(--gold-deep);
  letter-spacing: 0.18em; margin-top: 2px;
}

/* === B · 同心圓共振 === */
.logo-b { text-align: center; }
.logo-b svg { display: block; margin: 0 auto 14px; }
.logo-b .tc {
  font-family: var(--serif-tc); font-weight: 500;
  font-size: 22px; color: var(--ink); letter-spacing: 0.32em;
  padding-left: 0.32em;
}
.logo-b .en {
  font-family: var(--serif-en); font-style: italic;
  font-size: 11px; color: var(--gold-deep);
  letter-spacing: 0.32em; margin-top: 4px; padding-left: 0.32em;
  text-transform: uppercase;
}

/* === C · 水墨筆觸「心」 === */
.logo-c { text-align: center; }
.logo-c svg { display: block; margin: 0 auto; }
.logo-c .tc {
  font-family: var(--serif-tc); font-weight: 500;
  font-size: 14px; color: var(--ink); letter-spacing: 0.32em;
  margin-top: 12px; padding-left: 0.32em;
}

/* === D · 古印章圓刻 === */
.logo-d { text-align: center; }
.logo-d .seal-circle {
  width: 130px; height: 130px;
  border-radius: 50%;
  background: var(--cinnabar);
  display: grid; place-items: center;
  position: relative;
  margin: 0 auto;
}
.logo-d .seal-circle::before {
  content: ''; position: absolute;
  inset: 6px; border-radius: 50%;
  border: 1.5px solid rgba(245,241,232,0.4);
}
.logo-d .seal-inner {
  font-family: var(--serif-tc); font-weight: 500;
  color: var(--paper); font-size: 36px;
  letter-spacing: -0.04em;
  line-height: 1; text-align: center;
}
.logo-d .seal-inner small {
  display: block;
  font-size: 11px; letter-spacing: 0.3em;
  margin-top: 6px; opacity: 0.85;
  font-weight: 400;
}

/* === E · 線描印章 + 心字 === */
.logo-e {
  width: 130px; height: 130px;
  border: 1.2px solid var(--ink);
  position: relative;
  display: grid; place-items: center;
  margin: 0 auto;
}
.logo-e::before {
  content: ''; position: absolute;
  inset: 5px;
  border: 0.5px solid var(--ink);
}
.logo-e .e-glyph {
  font-family: var(--serif-tc); font-weight: 500;
  font-size: 56px; color: var(--ink);
  position: relative; z-index: 1;
}
.logo-e .e-glyph::after {
  content: '';
  position: absolute; inset: -10px;
  background: var(--cinnabar);
  z-index: -1; opacity: 0;
}
/* corner ticks */
.logo-e i { position: absolute; width: 8px; height: 8px; }
.logo-e i.tl { top: -1px; left: -1px; border-top: 2px solid var(--cinnabar); border-left: 2px solid var(--cinnabar); }
.logo-e i.tr { top: -1px; right: -1px; border-top: 2px solid var(--cinnabar); border-right: 2px solid var(--cinnabar); }
.logo-e i.bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--cinnabar); border-left: 2px solid var(--cinnabar); }
.logo-e i.br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cinnabar); border-right: 2px solid var(--cinnabar); }

/* === F · 流動線條 (心流) === */
.logo-f { text-align: center; }
.logo-f svg { display: block; margin: 0 auto 14px; }
.logo-f .tc {
  font-family: var(--serif-tc); font-weight: 500;
  font-size: 19px; color: var(--ink); letter-spacing: 0.28em;
  padding-left: 0.28em;
}
.logo-f .en {
  font-family: var(--serif-en); font-style: italic;
  font-size: 12px; color: var(--gold-deep);
  letter-spacing: 0.28em; margin-top: 4px;
  text-transform: uppercase;
}

/* === G · 量子點陣 === */
.logo-g { text-align: center; }
.logo-g .quantum {
  position: relative; width: 110px; height: 110px;
  margin: 0 auto 12px;
}
.logo-g .qcore {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 44px; height: 44px;
  background: var(--cinnabar);
  display: grid; place-items: center;
  font-family: var(--serif-tc); font-weight: 500;
  color: var(--paper); font-size: 28px;
  border-radius: 50%;
}
.logo-g .qring {
  position: absolute; inset: 0;
  border: 1px dashed var(--gold-deep);
  border-radius: 50%;
}
.logo-g .qring.r2 { inset: 14px; border-style: solid; opacity: 0.6; }
.logo-g .qdot {
  position: absolute; width: 6px; height: 6px;
  background: var(--gold-deep); border-radius: 50%;
}
.logo-g .qdot.d1 { left: 50%; top: -3px; transform: translateX(-50%); }
.logo-g .qdot.d2 { right: -3px; top: 50%; transform: translateY(-50%); background: var(--cinnabar); }
.logo-g .qdot.d3 { left: 50%; bottom: -3px; transform: translateX(-50%); }
.logo-g .qdot.d4 { left: -3px; top: 50%; transform: translateY(-50%); background: var(--cinnabar); }
.logo-g .tc {
  font-family: var(--serif-tc); font-weight: 500;
  font-size: 16px; color: var(--ink); letter-spacing: 0.28em;
}

/* === H · 縱向豎排 (古典書冊) === */
.logo-h {
  display: inline-grid; grid-template-columns: auto auto; gap: 16px; align-items: stretch;
}
.logo-h .stripe {
  width: 4px; background: linear-gradient(180deg, var(--cinnabar) 0%, var(--gold-deep) 100%);
}
.logo-h .vert {
  display: grid; grid-auto-flow: row; gap: 8px;
  font-family: var(--serif-tc); font-weight: 500;
  color: var(--ink); font-size: 22px; letter-spacing: 0;
  text-align: center;
}
.logo-h .vert .ji {
  width: 38px; height: 38px;
  background: var(--cinnabar); color: var(--paper);
  display: grid; place-items: center;
  font-size: 22px;
}
.logo-h .meta {
  align-self: end;
  font-family: var(--serif-en); font-style: italic;
  color: var(--gold-deep); font-size: 11px;
  letter-spacing: 0.22em; writing-mode: vertical-rl;
  text-transform: uppercase;
}

/* Mono variations */
.mono-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 24px; }
.mono-cell { aspect-ratio: 1; background: var(--ivory); display: grid; place-items: center; border: 1px solid var(--line); padding: 16px; }
.mono-cell.dark { background: var(--ink); }
.mono-cell.cinnabar { background: var(--cinnabar); }
.mono-cell.gold { background: var(--gold); }

/* Business Card */
.bcard {
  width: 100%; max-width: 520px; aspect-ratio: 91/55;
  margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr;
  box-shadow: 0 30px 60px -25px rgba(0,0,0,0.35), 0 8px 16px -8px rgba(0,0,0,0.18);
  position: relative;
}
.bcard .bc-front { background: var(--paper); padding: 30px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
.bcard .bc-back { background: var(--ink); padding: 30px; display: grid; place-items: center; position: relative; overflow: hidden; }
.bcard .bc-back::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(50% 70% at 70% 30%, rgba(201,169,106,0.18), transparent 60%);
}

.bcard .bc-front .bc-logo {
  display: flex; align-items: center; gap: 12px;
}
.bcard .bc-front .bc-logo .stamp {
  width: 44px; height: 44px;
  background: var(--cinnabar); color: var(--paper);
  display: grid; place-items: center;
  font-family: var(--serif-tc); font-weight: 500; font-size: 26px;
}
.bcard .bc-front .bc-logo .word { line-height: 1.1; }
.bcard .bc-front .bc-logo .tc { font-family: var(--serif-tc); font-weight: 500; font-size: 13px; color: var(--ink); letter-spacing: 0.2em; }
.bcard .bc-front .bc-logo .en { font-family: var(--serif-en); font-style: italic; font-size: 9px; color: var(--gold-deep); letter-spacing: 0.2em; margin-top: 2px; text-transform: uppercase; }

.bcard .bc-front .bc-name { padding: 6px 0 0; }
.bcard .bc-front .bc-name h3 { font-family: var(--serif-tc); font-weight: 500; font-size: 17px; color: var(--ink); letter-spacing: 0.1em; margin: 0 0 2px; }
.bcard .bc-front .bc-name .role { font-family: var(--serif-en); font-style: italic; color: var(--gold-deep); font-size: 11px; letter-spacing: 0.18em; }

.bcard .bc-front .bc-meta {
  font-family: var(--serif-en); font-style: italic;
  color: var(--ink-soft); font-size: 10px; line-height: 1.7; letter-spacing: 0.04em;
}
.bcard .bc-front .bc-meta .row { display: flex; gap: 6px; }
.bcard .bc-front .bc-meta .k { color: var(--gold-deep); width: 50px; flex-shrink: 0; letter-spacing: 0.16em; text-transform: uppercase; }

.bcard .bc-back .bc-seal {
  position: relative; z-index: 1; text-align: center;
}
.bcard .bc-back .bc-seal .glyph {
  font-family: var(--serif-tc); font-weight: 500; font-size: 64px; color: var(--gold-light); letter-spacing: 0; line-height: 1;
}
.bcard .bc-back .bc-seal .tc { font-family: var(--serif-tc); font-weight: 400; color: var(--paper); font-size: 13px; letter-spacing: 0.32em; margin-top: 14px; padding-left: 0.32em; }
.bcard .bc-back .bc-seal .en { font-family: var(--serif-en); font-style: italic; color: var(--gold-light); font-size: 9px; letter-spacing: 0.28em; margin-top: 4px; text-transform: uppercase; }

/* Favicon strip */
.favicon-strip {
  display: flex; gap: 12px; align-items: center; justify-content: center; padding: 16px;
  flex-wrap: wrap;
}
.fav { width: 32px; height: 32px; display: grid; place-items: center; font-family: var(--serif-tc); font-weight: 500; }
.fav.size16 { width: 16px; height: 16px; font-size: 11px; }
.fav.size24 { width: 24px; height: 24px; font-size: 16px; }
.fav.size32 { width: 32px; height: 32px; font-size: 20px; }
.fav.size48 { width: 48px; height: 48px; font-size: 30px; }
.fav.size64 { width: 64px; height: 64px; font-size: 40px; }
.fav.cinnabar { background: var(--cinnabar); color: var(--paper); }

/* Construction grid (showing geometry) */
.construct-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 30px; align-items: center;
}
.construct-cell { background: var(--ivory); border: 1px dashed var(--gold); padding: 30px; position: relative; min-height: 200px; display: grid; place-items: center; }
.construct-cell .label { position: absolute; bottom: 8px; left: 12px; font-family: var(--serif-en); font-style: italic; font-size: 10px; color: var(--gold-deep); letter-spacing: 0.16em; text-transform: uppercase; }

/* Notes */
.note-block { padding: 20px 24px; }
.note-block h4 { font-family: var(--serif-tc); font-weight: 500; font-size: 16px; color: var(--ink); margin: 0 0 8px; letter-spacing: 0.08em; }
.note-block p { font-family: var(--serif-tc); font-weight: 400; font-size: 13px; color: var(--ink-soft); line-height: 1.85; margin: 0 0 8px; }
.note-block .label-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
.note-block .tag { padding: 3px 10px; background: var(--paper-warm); border: 1px solid var(--line); font-family: var(--serif-en); font-style: italic; font-size: 10px; color: var(--gold-deep); letter-spacing: 0.16em; text-transform: uppercase; }

/* Color palette swatches */
.palette { display: grid; grid-template-columns: repeat(5, 1fr); padding: 0; }
.swatch { aspect-ratio: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; font-family: var(--serif-en); font-style: italic; font-size: 9px; letter-spacing: 0.1em; }
.swatch .hex { display: block; opacity: 0.85; margin-top: 2px; font-size: 10px; }
.sw1 { background: var(--paper); color: var(--ink); }
.sw2 { background: var(--ink); color: var(--paper); }
.sw3 { background: var(--cinnabar); color: var(--paper); }
.sw4 { background: var(--gold); color: var(--ink); }
.sw5 { background: var(--paper-warm); color: var(--ink); }
</style>
</head>
<body>
